<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo Drive">
<meta name="theme-color" content="#16132e">
<title>Tempo Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* One-screen dashboard: tempo on the left, speed on the right, big Play control docked low
   where a thumb reaches it. Single dark look for night driving. */
:root{
  --bg:#16132e; --panel:#211d42; --line:#3a3466; --fg:#f4f0ff; --muted:#a59dcc;
  --accent:#ff5c8a; --accent-2:#ffd166; --ok:#5fe0a8; --warn:#ffb347;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{min-height:100%;display:flex;flex-direction:column;gap:18px;max-width:560px;margin:0 auto;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dash{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:12px;min-height:0}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.stat.right{align-items:flex-end;text-align:right}
.label,.unit{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.big{font:700 clamp(84px,27vw,200px)/.85 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat.right .big{color:var(--accent)}
.chip{align-self:center;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warn)} .chip.test i{background:var(--accent-2)}

.controls{display:flex;flex-direction:column;gap:12px}
.go{appearance:none;border:0;border-radius:18px;padding:22px;font:700 30px/1 var(--display);letter-spacing:.1em;
  text-transform:uppercase;background:var(--accent);color:#1b0f22;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
.go .ico{font-size:24px;letter-spacing:0}
.go.stop{background:var(--panel);color:var(--fg);border:2px solid var(--accent)}
.go:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.msg{font-size:13px;color:var(--warn)}

details{background:var(--panel);border:1px solid var(--line);border-radius:14px}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted)} details[open] summary::after{content:"–"}
.settings{display:grid;gap:14px;padding:0 16px 16px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.row label{color:var(--muted);font-size:14px}
.row input[type=number],.row select{width:104px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 15px var(--body);font-variant-numeric:tabular-nums}
.test{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--bg)}
.test input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;color:var(--fg);font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.foot{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="app">
  <main class="dash">
    <div class="stat">
      <div class="label">Tempo</div>
      <div class="big" id="bpm">84</div>
      <div class="unit">BPM</div>
    </div>
    <div class="stat right">
      <div class="label">Speed</div>
      <div class="big" id="mph">0</div>
      <div class="unit">MPH</div>
    </div>
  </main>

  <section class="controls">
    <div class="chip" id="chip"><i></i><span id="chipText">GPS off</span></div>
    <div class="msg" id="msg" hidden></div>
    <button class="go" id="go"><span class="ico" aria-hidden="true">▶</span> <span id="goText">Play</span></button>

    <details>
      <summary>Settings</summary>
      <div class="settings">
        <div class="row"><label for="minBpm">Tempo when stopped (BPM)</label><input id="minBpm" type="number" min="50" max="200" step="1"></div>
        <div class="row"><label for="maxBpm">Tempo at top speed (BPM)</label><input id="maxBpm" type="number" min="60" max="220" step="1"></div>
        <div class="row"><label for="topMph">Top speed (mph)</label><input id="topMph" type="number" min="10" max="120" step="1"></div>
        <div class="row"><label for="response">Tempo response</label>
          <select id="response"><option value="gentle">Gentle</option><option value="normal">Normal</option><option value="quick">Quick</option></select></div>
        <div class="row"><label for="energy">Speed changes energy</label>
          <select id="energy"><option value="on">On</option><option value="off">Off</option></select></div>

        <div class="test">
          <label class="check"><input type="checkbox" id="testMode"> Test without driving</label>
          <div id="simWrap" hidden>
            <input type="range" id="sim" min="0" max="90" step="1" value="0" aria-label="Simulated speed in mph">
            <div class="ends"><span>0 mph</span><span id="simVal">0 mph</span><span>90 mph</span></div>
          </div>
        </div>

      </div>
    </details>
    <div class="foot">Set it up before you drive. Keep this screen open and the phone plugged in.</div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------- settings ---------- */
const DEF = {minBpm:84, maxBpm:145, topMph:75, response:'normal', energy:'on'};
const KEY = 'td-settings-v2';
const S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const TAU = {gentle:6, normal:3, quick:1.2};

const st = {playing:false, rawMph:0, smoothMph:0, bpm:S.minBpm, energy:0,
  test:false, simMph:0, gps:'off', acc:null, lastFix:0};

/* ---------- audio core ----------
   drums ─────────────────────────────────────────────┐
   pads, chords, bass → musicIn → filter → pump (sidechain) → out → compressor → speakers
   lead and plucks ────────────────────────────────────┘ (with reverb and tempo-synced delay sends) */
let ctx = null, out = null, noiseBuf = null, revIn = null, dlyIn = null, delay = null;
let musicIn = null, sweep = null, pump = null;
function impulse(sec, decay) {
  const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function ensureCtx() {
  if (!ctx) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} // play even with the silent switch on
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.15;
    const master = ctx.createGain(); master.gain.value = 0.8;
    master.connect(comp); comp.connect(ctx.destination);
    out = ctx.createGain(); out.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const conv = ctx.createConvolver(); conv.buffer = impulse(2.8, 3);
    revIn = ctx.createGain(); const revOut = ctx.createGain(); revOut.gain.value = 0.4;
    revIn.connect(conv); conv.connect(revOut); revOut.connect(master);
    dlyIn = ctx.createGain(); delay = ctx.createDelay(2); delay.delayTime.value = 0.375;
    const fb = ctx.createGain(); fb.gain.value = 0.3;
    const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 3500;
    const dOut = ctx.createGain(); dOut.gain.value = 0.25;
    dlyIn.connect(delay); delay.connect(dlp); dlp.connect(fb); fb.connect(delay); dlp.connect(dOut); dOut.connect(master);
    musicIn = ctx.createGain();
    sweep = ctx.createBiquadFilter(); sweep.type = 'lowpass'; sweep.Q.value = 0.7; sweep.frequency.value = 3000;
    pump = ctx.createGain();
    musicIn.connect(sweep); sweep.connect(pump); pump.connect(out);
    const busRev = ctx.createGain(); busRev.gain.value = 0.2; pump.connect(busRev); busRev.connect(revIn);
  }
  if (ctx.state !== 'running') ctx.resume();
}
function sendTo(node, rev, dly, dest) {
  node.connect(dest || out);
  if (rev) { const g = ctx.createGain(); g.gain.value = rev; node.connect(g); g.connect(revIn); }
  if (dly) { const g = ctx.createGain(); g.gain.value = dly; node.connect(g); g.connect(dlyIn); }
}

/* ---------- instruments ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function note(t, m, dur, p, velo, dest) {
  const v = p.vol * (velo || 1), a = p.a || 0.005, d = p.d || 0.15, s = p.s == null ? 0.7 : p.s, r = p.r || 0.1;
  const end = t + Math.max(dur, a);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = p.q || 0.7;
  if (p.fenv) { f.frequency.setValueAtTime(p.cut * p.fenv, t); f.frequency.setTargetAtTime(p.cut, t, p.fdec || 0.08); }
  else f.frequency.value = p.cut;
  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0, t); amp.gain.linearRampToValueAtTime(v, t + a);
  amp.gain.setTargetAtTime(v * s, t + a, d / 3); amp.gain.setTargetAtTime(0, end, r / 3);
  p.waves.forEach(([type, det, oct]) => {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.value = mtof(m + 12 * (oct || 0)); o.detune.value = det || 0;
    o.connect(f); o.start(t); o.stop(end + r * 2 + 0.05);
  });
  f.connect(amp);
  if (dest) amp.connect(dest); else sendTo(amp, p.rev, p.dly);
}
// supersaws: three detuned saws per note, the standard EDM chord and lead sound
const P = {
  pad:   {waves:[['sawtooth',-14],['sawtooth',0],['sawtooth',14]], cut:2600, a:0.12, d:0.8, s:0.85, r:0.4, vol:0.026},
  saws:  {waves:[['sawtooth',-15],['sawtooth',0],['sawtooth',15]], cut:6000, fenv:1.2, fdec:0.1, a:0.005, d:0.4, s:0.75, r:0.15, vol:0.028},
  lead:  {waves:[['sawtooth',-12],['sawtooth',0],['sawtooth',12],['square',0,-1]], cut:5000, fenv:1.4, fdec:0.08, a:0.005, d:0.2, s:0.75, r:0.1, vol:0.045, rev:0.25, dly:0.22},
  pluck: {waves:[['sawtooth',-8],['sawtooth',8],['triangle',0,1]], cut:3200, fenv:2, fdec:0.06, a:0.002, d:0.22, s:0, r:0.15, vol:0.055, rev:0.35, dly:0.28},
  arp:   {waves:[['sawtooth',-6],['sawtooth',6]], cut:2600, fenv:1.8, fdec:0.04, a:0.002, d:0.12, s:0, r:0.08, vol:0.03, rev:0.25, dly:0.25},
  bass:  {waves:[['sawtooth',0],['sine',0,-1]], cut:450, fenv:1.8, fdec:0.05, q:1.2, a:0.004, d:0.15, s:0.7, r:0.05, vol:0.24},
};
function kick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.setTargetAtTime(48, t, 0.028);
  g.gain.setValueAtTime(1, t); g.gain.setTargetAtTime(0, t + 0.04, 0.09);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.6);
  noiseHit(t, 'highpass', 3500, 0.7, 0.05, 0.008, 0);
}
function boom(t) { // drop impact
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(90, t); o.frequency.setTargetAtTime(35, t, 0.2);
  g.gain.setValueAtTime(0.7, t); g.gain.setTargetAtTime(0, t + 0.1, 0.5);
  o.connect(g); sendTo(g, 0.3, 0); o.start(t); o.stop(t + 2.5);
}
function noiseHit(t, type, freq, q, v, dec, rev) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.setValueAtTime(v, t); g.gain.setTargetAtTime(0, t, dec / 3);
  s.connect(f); f.connect(g); sendTo(g, rev, 0);
  s.start(t, Math.random() * 1.5); s.stop(t + dec * 2 + 0.05);
}
function snare(t, v) {
  noiseHit(t, 'highpass', 1500, 0.7, 0.34 * v, 0.13, 0.25);
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(220, t); o.frequency.setTargetAtTime(170, t, 0.03);
  g.gain.setValueAtTime(0.22 * v, t); g.gain.setTargetAtTime(0, t, 0.03);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.2);
}
function clap(t) { [0, 0.01, 0.021].forEach((o, i) => noiseHit(t + o, 'bandpass', 1300, 1, 0.28, i === 2 ? 0.16 : 0.02, 0.3)); }
const hat = (t, open, v) => noiseHit(t, 'highpass', 9000, 0.7, (open ? 0.11 : 0.06) * (v || 1), open ? 0.16 : 0.03, 0);
const shaker = (t, v) => noiseHit(t, 'bandpass', 7000, 1.5, 0.04 * (v || 1), 0.05, 0);
const crash = t => noiseHit(t, 'highpass', 5000, 0.5, 0.1, 1.8, 0.35);
function riser(t, len) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.5;
  f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(9000, t + len);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + len); g.gain.linearRampToValueAtTime(0, t + len + 0.03);
  s.connect(f); f.connect(g); sendTo(g, 0.3, 0); s.start(t); s.stop(t + len + 0.1);
}
function duck(t, spb, depth) { // sidechain pump on the music bus
  pump.gain.setValueAtTime(1 - depth, t);
  pump.gain.setTargetAtTime(1, t + 0.01, spb * 0.8);
}

/* ---------- the endless mix ---------- */
const clampI = (x, a, b) => Math.min(b, Math.max(a, x));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const MINOR = [0,2,3,5,7,8,10];
// four-chord loops in a minor key: [semitones above the key, minor or major triad]
const PROGS = [
  [[0,'m'],[8,'M'],[3,'M'],[10,'M']],
  [[8,'M'],[10,'M'],[0,'m'],[0,'m']],
  [[0,'m'],[10,'M'],[8,'M'],[10,'M']],
  [[5,'m'],[8,'M'],[0,'m'],[10,'M']],
  [[8,'M'],[3,'M'],[10,'M'],[0,'m']],
];
const RHY = [ // lead rhythms, [step, length] in 16ths over two bars
  [[0,3],[3,3],[6,2],[8,4],[14,2],[16,3],[19,3],[22,2],[24,6]],
  [[0,2],[2,2],[4,4],[10,2],[12,4],[16,2],[18,2],[20,6],[28,2],[30,2]],
  [[0,3],[3,3],[6,3],[9,3],[12,4],[16,3],[19,3],[22,3],[25,3],[28,4]],
  [[0,2],[3,2],[6,2],[8,2],[10,4],[16,2],[19,2],[22,2],[24,8]],
  [[2,2],[4,2],[6,2],[8,6],[18,2],[20,2],[22,2],[24,4],[28,4]],
];
// one cycle is 40 bars; it repeats forever with new chords and melodies
const PHASES = [['Groove',8],['Breakdown',8],['Build',8],['Drop',16]];
const CYCLE = PHASES.reduce((a, p) => a + p[1], 0);
function phaseOf(pos) { let acc = 0; for (const [name, len] of PHASES) { if (pos < acc + len) return {name, bi:pos - acc, len}; acc += len; } }
const triad = (key, [off, q]) => { const r = (key + off) % 12; return {root:r, pcs:(q === 'm' ? [0,3,7] : [0,4,7]).map(i => (r + i) % 12)}; };
const voice = (pcs, lo) => pcs.map(pc => lo + ((pc - lo) % 12 + 12) % 12).sort((a, b) => a - b);
function makeMelody(key, chords) { // catchy four-bar hook: chord tones on the beat, stepwise in between
  const scale = []; for (let m = 67; m <= 82; m++) if (MINOR.includes(((m - key) % 12 + 12) % 12)) scale.push(m);
  const a = pick(RHY), b = Math.random() < 0.65 ? a : pick(RHY);
  const pattern = a.concat(b.map(([s, l]) => [s + 32, l]));
  let prev = scale[Math.floor(scale.length / 2)];
  const mel = new Map();
  pattern.forEach(([s, l], i) => {
    const ch = chords[Math.floor(s / 16)];
    let cand = (s % 4 === 0 || i === 0)
      ? scale.filter(m => ch.pcs.includes(m % 12) && Math.abs(m - prev) <= 7)
      : scale.filter(m => Math.abs(m - prev) <= 3 && m !== prev);
    if (!cand.length) cand = scale.filter(m => ch.pcs.includes(m % 12));
    cand.sort((x, y) => (Math.abs(x - prev) + Math.random() * 3) - (Math.abs(y - prev) + Math.random() * 3));
    prev = cand[0]; mel.set(s, {m:prev, l});
  });
  return mel;
}

const sessionKey = pick([9, 5, 7, 2, 0]); // A, F, G, D or C minor, fixed for the session
let bar = 0, stepInBar = 0, cyc = null, cutNow = 3000;
function newCycle() {
  const keep = cyc && Math.random() < 0.4;
  const prog = keep ? cyc.prog : pick(PROGS.filter(p => !cyc || p !== cyc.prog));
  const chords = prog.map(c => triad(sessionKey, c));
  cyc = {n: cyc ? cyc.n + 1 : 0, prog, chords, melody: keep ? cyc.melody : makeMelody(sessionKey, chords)};
}
function cutoffAt(pos) {
  const ph = phaseOf(pos % CYCLE), f = ph.bi / ph.len, ex = (a, b) => a * Math.pow(b / a, f);
  return {Groove:ex(2500, 5000), Breakdown:ex(900, 2600), Build:ex(700, 16000), Drop:16000}[ph.name];
}
function playStep(t, spb) {
  const s = stepInBar, pos = bar % CYCLE;
  if (s === 0 && (pos === 0 || !cyc)) newCycle();
  const ph = phaseOf(pos), name = ph.name, k = S.energy === 'on' ? st.energy : 0.6;
  const ch = cyc.chords[bar % 4], melStep = (ph.bi % 4) * 16 + s;
  const lastBuildBar = name === 'Build' && ph.bi === ph.len - 1;
  const gap = lastBuildBar && s >= 12; // the classic silent beat before the drop

  if (s === 0) {
    const next = cutoffAt(pos + 1);
    sweep.frequency.setValueAtTime(cutNow, t); sweep.frequency.exponentialRampToValueAtTime(next, t + spb * 16);
    cutNow = next;
    delay.delayTime.setTargetAtTime(spb * 3, t, 0.05); // dotted-eighth echo follows the tempo
  }

  // drums
  const kickOn = name === 'Drop' || name === 'Groove' || (name === 'Build' && !lastBuildBar);
  if (kickOn && s % 4 === 0) { kick(t); duck(t, spb, name === 'Drop' ? 0.75 : 0.6); }
  if ((name === 'Drop' || (name === 'Groove' && ph.bi >= 2)) && (s === 4 || s === 12)) clap(t);
  if ((name === 'Drop' || name === 'Groove') && s % 4 === 2) hat(t, true);
  if ((name === 'Drop' || (name === 'Groove' && k > 0.5)) && s % 2 === 1) hat(t, false, 0.7);
  if ((name === 'Drop' || name === 'Groove') && k > 0.3 && s % 2 === 1) shaker(t, 0.5 + 0.5 * k);
  if (name === 'Build' && !gap) {
    const every = ph.bi < 4 ? 4 : ph.bi < 6 ? 2 : 1;
    if (s % every === 0) snare(t, 0.25 + 0.65 * ((ph.bi * 16 + s) / (ph.len * 16)));
  }
  if (name === 'Build' && ph.bi === 0 && s === 0) riser(t, spb * 16 * ph.len - spb * 4);
  if (name === 'Drop' && s === 0 && ph.bi % 8 === 0) { crash(t); if (ph.bi === 0) boom(t); }

  // offbeat bass (the house/EDM bounce), plus a sub note on the downbeat in the drop
  const bn = 36 + ((ch.root - 36) % 12 + 12) % 12;
  if ((name === 'Drop' || name === 'Groove' || (name === 'Build' && ph.bi >= 4 && !lastBuildBar)) && s % 4 === 2) note(t, bn, spb * 1.6, P.bass, 1, musicIn);
  if (name === 'Drop' && s === 0) note(t, bn - 12, spb * 3, P.bass, 0.8, musicIn);

  // chords through the pumping filter bus
  if (s === 0 && name !== 'Drop' && !lastBuildBar) voice(ch.pcs, 57).forEach(m => note(t, m, spb * 15.5, P.pad, name === 'Breakdown' ? 1.1 : 0.8, musicIn));
  if (s === 0 && name === 'Drop') { const v = voice(ch.pcs, 57); v.concat([v[0] + 12]).forEach(m => note(t, m, spb * 15, P.saws, 1, musicIn)); }

  // groove arpeggio, busier at speed
  if (name === 'Groove' && (s % 2 === 0 || k > 0.6)) {
    const tones = voice(ch.pcs, 64).concat([voice(ch.pcs, 64)[0] + 12]);
    note(t, tones[(s % 2 === 0 ? s / 2 : s) % 4], spb * 0.9, P.arp, s % 2 ? 0.6 : 1);
  }
  // the hook: soft pluck in the breakdown and build, full supersaw lead in the drop
  const hook = cyc.melody.get(melStep);
  if (hook && !gap) {
    if (name === 'Drop') note(t, hook.m, hook.l * spb * 0.92, P.lead);
    else if (name === 'Breakdown' || name === 'Build') note(t, hook.m, hook.l * spb * 0.92, P.pluck, name === 'Build' ? 0.8 : 1);
  }

  stepInBar++;
  if (stepInBar === 16) { stepInBar = 0; bar++; }
}
let grooveTimer = null, nextTime = 0;
function startGroove() {
  ensureCtx(); nextTime = ctx.currentTime + 0.1; stepInBar = 0;
  grooveTimer = setInterval(() => {
    while (nextTime < ctx.currentTime + 0.15) {
      const spb = 60 / st.bpm / 4;
      playStep(nextTime, spb);
      nextTime += spb;
    }
  }, 25);
}
function stopGroove() { clearInterval(grooveTimer); grooveTimer = null; if (stepInBar) { stepInBar = 0; bar++; } }

/* ---------- GPS speed ---------- */
let watchId = null, lastPos = null;
function hav(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLon = toR(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function startGps() {
  if (watchId !== null) return;
  if (!('geolocation' in navigator)) { st.gps = 'none'; return; }
  if (!window.isSecureContext) { st.gps = 'insecure'; return; }
  st.gps = 'search';
  watchId = navigator.geolocation.watchPosition(p => {
    const c = p.coords, here = {lat:c.latitude, lon:c.longitude, t:p.timestamp};
    let mps = (c.speed !== null && c.speed >= 0) ? c.speed : null;
    if (mps === null && lastPos && c.accuracy < 40) {
      const dt = (here.t - lastPos.t) / 1000;
      if (dt > 0.5) mps = hav(lastPos, here) / dt;
    }
    lastPos = here;
    if (mps !== null) st.rawMph = mps * 2.23694;
    st.acc = c.accuracy; st.gps = 'ok'; st.lastFix = performance.now();
  }, err => { st.gps = err.code === 1 ? 'denied' : 'search'; },
  {enableHighAccuracy:true, maximumAge:0, timeout:20000});
}
function stopGps() { if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; lastPos = null; st.gps = 'off'; }

/* ---------- speed → tempo and energy ---------- */
let lastT = performance.now();
setInterval(() => {
  const now = performance.now(), dt = (now - lastT) / 1000; lastT = now;
  let src = st.test ? st.simMph : st.rawMph;
  if (src < 2) src = 0; // GPS jitter when parked
  st.smoothMph += (src - st.smoothMph) * (1 - Math.exp(-dt / (TAU[S.response] || 3)));
  st.energy = clamp(st.smoothMph / S.topMph, 0, 1);
  st.bpm = S.minBpm + (S.maxBpm - S.minBpm) * st.energy;
}, 100);

/* ---------- wake lock ---------- */
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && st.playing) { keepAwake(); if (ctx) ctx.resume(); }
});

/* ---------- controls ---------- */
const showMsg = t => { const m = $('#msg'); m.textContent = t; m.hidden = false; };
const hideMsg = () => { $('#msg').hidden = true; };
function startAudio() { startGroove(); }
function stopAudio() { stopGroove(); }
$('#go').addEventListener('click', () => {
  if (!st.playing) {
    ensureCtx(); st.playing = true;
    if (!st.test) startGps();
    keepAwake(); startAudio();
  } else {
    st.playing = false; stopAudio(); stopGps();
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
});
function bindNum(id, key, lo, hi) {
  const el = $('#' + id); el.value = S[key];
  el.addEventListener('change', () => {
    let v = Math.round(+el.value); if (!isFinite(v)) v = DEF[key];
    v = clamp(v, lo, hi); S[key] = v; el.value = v;
    if (S.maxBpm <= S.minBpm) { S.maxBpm = S.minBpm + 1; $('#maxBpm').value = S.maxBpm; }
    save();
  });
}
bindNum('minBpm', 'minBpm', 50, 200); bindNum('maxBpm', 'maxBpm', 60, 220);
bindNum('topMph', 'topMph', 10, 120);
['response', 'energy'].forEach(id => { const el = $('#' + id); el.value = S[id]; el.addEventListener('change', () => { S[id] = el.value; save(); }); });
$('#testMode').addEventListener('change', e => {
  st.test = e.target.checked; $('#simWrap').hidden = !st.test;
  if (st.test) stopGps(); else if (st.playing) startGps();
});
$('#sim').addEventListener('input', e => { st.simMph = +e.target.value; $('#simVal').textContent = e.target.value + ' mph'; });

/* ---------- render ---------- */
function chip() {
  const c = $('#chip'); let cls = '', txt;
  if (st.test) { cls = 'test'; txt = 'Test mode'; }
  else if (st.gps === 'ok') {
    const stale = performance.now() - st.lastFix > 10000;
    cls = stale ? 'warn' : 'ok'; txt = stale ? 'GPS signal lost' : 'GPS ±' + Math.round(st.acc) + ' m';
  }
  else if (st.gps === 'search') { cls = 'warn'; txt = 'Finding GPS…'; }
  else if (st.gps === 'denied') { cls = 'warn'; txt = 'Location blocked'; }
  else if (st.gps === 'insecure') { cls = 'warn'; txt = 'Needs https'; }
  else if (st.gps === 'none') { cls = 'warn'; txt = 'No GPS'; }
  else txt = 'GPS off';
  c.className = 'chip ' + cls; $('#chipText').textContent = txt;
}
function frame() {
  $('#bpm').textContent = Math.round(st.bpm);
  $('#mph').textContent = Math.round(st.smoothMph);
  $('#goText').textContent = st.playing ? 'Pause' : 'Play'; $('.go .ico').textContent = st.playing ? '❚❚' : '▶';
  $('#go').classList.toggle('stop', st.playing);
  chip();
  if (st.gps === 'denied' && !st.test) showMsg('Location is blocked. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using.');

  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
