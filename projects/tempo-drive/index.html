<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo Drive">
<meta name="theme-color" content="#16132e">
<title>Tempo Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* One-screen dashboard: huge BPM readout up top, speed + tempo-map strip in the middle,
   big Start control docked low where a thumb reaches it. Single dark look for night driving. */
:root{
  --bg:#16132e; --panel:#211d42; --line:#3a3466; --fg:#f4f0ff; --muted:#a59dcc;
  --accent:#ff5c8a; --accent-2:#ffd166; --ok:#5fe0a8; --warn:#ffb347;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{min-height:100%;display:flex;flex-direction:column;gap:18px;max-width:560px;margin:0 auto;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--accent)}
.chip{font-size:12px;font-weight:600;letter-spacing:.04em;padding:6px 10px;border-radius:999px;
  background:var(--panel);color:var(--muted);border:1px solid var(--line);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warn)} .chip.test i{background:var(--accent-2)}

.readout{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-top:6px}
.label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bpm{font:700 clamp(120px,40vw,220px)/.82 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.beats{display:flex;gap:10px;margin:10px 0 0 4px}
.beats b{width:16px;height:16px;border-radius:50%;background:var(--line);transition:background .06s,transform .06s}
.beats b.on{background:var(--accent);transform:scale(1.25)}
.beats b.on.down{background:var(--accent-2)}

.speedrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mph{font:700 64px/1 var(--display);font-variant-numeric:tabular-nums;flex:none}
.mph small{font:600 18px/1 var(--display);letter-spacing:.08em;color:var(--muted);margin-left:6px}
.now{min-width:0;text-align:right;color:var(--muted);font-size:13px}
.now strong{display:block;color:var(--fg);font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now span.sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.map{display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#7b5cff,var(--accent));transition:width .25s linear}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.controls{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.gorow{display:grid;grid-template-columns:1fr auto;gap:10px}
.go{appearance:none;border:0;border-radius:18px;padding:22px;font:700 30px/1 var(--display);letter-spacing:.1em;
  text-transform:uppercase;background:var(--accent);color:#1b0f22;cursor:pointer}
.go.stop{background:var(--panel);color:var(--fg);border:2px solid var(--accent)}
.skip{appearance:none;border:2px solid var(--line);border-radius:18px;padding:0 18px;background:var(--panel);color:var(--fg);
  font:700 18px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.skip:disabled{opacity:.4;cursor:default}
.go:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,label.small:focus-within{outline:3px solid var(--accent-2);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;border-radius:9px;padding:11px 8px;background:transparent;color:var(--muted);font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.msg{font-size:13px;color:var(--warn)}

details{background:var(--panel);border:1px solid var(--line);border-radius:14px}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted)} details[open] summary::after{content:"–"}
.settings{display:grid;gap:14px;padding:0 16px 16px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.row label{color:var(--muted);font-size:14px}
.row input[type=number],.row select{width:104px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 15px var(--body);font-variant-numeric:tabular-nums}
.test{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--bg)}
.test input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;color:var(--fg);font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.lib{display:grid;gap:8px;font-size:13px;color:var(--muted)}
.lib ul{margin:0;padding-left:18px;max-height:140px;overflow:auto}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.small{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:9px 12px;font:600 13px var(--body);cursor:pointer}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.fill,.beats b{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Tempo<span>·</span>Drive</div>
    <div class="chip" id="chip"><i></i><span id="chipText">GPS off</span></div>
  </header>

  <section class="readout">
    <div class="label">Tempo</div>
    <div class="bpm" id="bpm">84</div>
    <div class="beats" id="beats"><b></b><b></b><b></b><b></b></div>
  </section>

  <section class="speedrow">
    <div class="mph"><span id="mph">0</span><small>MPH</small></div>
    <div class="now"><span class="label">Playing</span><strong id="now">Nothing yet</strong><span class="sub" id="nowSub"></span></div>
  </section>

  <section class="map" aria-label="Speed to tempo map">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="ends"><span id="endLo"></span><span id="endHi"></span></div>
  </section>

  <section class="controls">
    <div class="seg" role="group" aria-label="Music source">
      <button id="modeGroove" aria-pressed="true">Pop radio</button>
      <button id="modeLoops" aria-pressed="false">AI loops</button>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="gorow">
      <button class="go" id="go">Start</button>
      <button class="skip" id="skip" disabled>Next<br>song</button>
    </div>

    <details>
      <summary>Settings &amp; loops</summary>
      <div class="settings">
        <div class="row"><label for="minBpm">Tempo when stopped (BPM)</label><input id="minBpm" type="number" min="50" max="200" step="1"></div>
        <div class="row"><label for="maxBpm">Tempo at top speed (BPM)</label><input id="maxBpm" type="number" min="60" max="220" step="1"></div>
        <div class="row"><label for="topMph">Top speed (mph)</label><input id="topMph" type="number" min="10" max="120" step="1"></div>
        <div class="row"><label for="response">Tempo response</label>
          <select id="response"><option value="gentle">Gentle</option><option value="normal">Normal</option><option value="quick">Quick</option></select></div>
        <div class="row"><label for="energy">Speed changes energy</label>
          <select id="energy"><option value="on">On</option><option value="off">Off</option></select></div>

        <div class="test">
          <label class="check"><input type="checkbox" id="testMode"> Test without driving</label>
          <div id="simWrap" hidden>
            <input type="range" id="sim" min="0" max="90" step="1" value="0" aria-label="Simulated speed in mph">
            <div class="ends"><span>0 mph</span><span id="simVal">0 mph</span><span>90 mph</span></div>
          </div>
        </div>

        <div class="lib">
          <div><strong style="color:var(--fg)" id="libCount">0 loops</strong> for AI loops mode. Loops in the <code>loops/</code> folder load automatically; files added here stay on this phone.</div>
          <ul id="libList"></ul>
          <div class="row"><label for="repeats">Plays per loop before switching</label><input id="repeats" type="number" min="1" max="8" step="1"></div>
          <div class="row"><label for="baseBpm">BPM for added files without “120bpm” in the name</label><input id="baseBpm" type="number" min="50" max="200" step="1"></div>
          <div class="btnrow">
            <label class="small" for="fileIn">Add loops from Files</label>
            <input id="fileIn" type="file" accept="audio/*" multiple hidden>
            <button class="small" id="clearLib">Remove added loops</button>
          </div>
        </div>
      </div>
    </details>
    <div class="foot">Set it up before you drive. Keep this screen open and the phone plugged in.</div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------- settings ---------- */
const DEF = {minBpm:84, maxBpm:145, topMph:75, response:'normal', energy:'on', baseBpm:120, repeats:2};
const KEY = 'td-settings-v2';
const S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const TAU = {gentle:6, normal:3, quick:1.2};

const st = {playing:false, mode:'groove', rawMph:0, smoothMph:0, bpm:S.minBpm, energy:0,
  test:false, simMph:0, gps:'off', acc:null, lastFix:0, now:'Nothing yet', sub:''};

/* ---------- audio core: master bus with reverb and tempo-synced delay ---------- */
let ctx = null, out = null, noiseBuf = null, revIn = null, dlyIn = null, delay = null;
function impulse(sec, decay) {
  const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function ensureCtx() {
  if (!ctx) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} // play even with the silent switch on
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
    const master = ctx.createGain(); master.gain.value = 0.85;
    master.connect(comp); comp.connect(ctx.destination);
    out = ctx.createGain(); out.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const conv = ctx.createConvolver(); conv.buffer = impulse(2.4, 3);
    revIn = ctx.createGain(); const revOut = ctx.createGain(); revOut.gain.value = 0.45;
    revIn.connect(conv); conv.connect(revOut); revOut.connect(master);
    dlyIn = ctx.createGain(); delay = ctx.createDelay(2); delay.delayTime.value = 0.375;
    const fb = ctx.createGain(); fb.gain.value = 0.3;
    const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2800;
    const dOut = ctx.createGain(); dOut.gain.value = 0.3;
    dlyIn.connect(delay); delay.connect(dlp); dlp.connect(fb); fb.connect(delay); dlp.connect(dOut); dOut.connect(master);
  }
  if (ctx.state !== 'running') ctx.resume();
}
function sendTo(node, rev, dly) {
  node.connect(out);
  if (rev) { const g = ctx.createGain(); g.gain.value = rev; node.connect(g); g.connect(revIn); }
  if (dly) { const g = ctx.createGain(); g.gain.value = dly; node.connect(g); g.connect(dlyIn); }
}

/* ---------- instruments ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function note(t, m, dur, p, velo) {
  const v = p.vol * (velo || 1), a = p.a || 0.005, d = p.d || 0.15, s = p.s == null ? 0.7 : p.s, r = p.r || 0.1;
  const end = t + Math.max(dur, a);
  const f = ctx.createBiquadFilter(); f.type = p.ftype || 'lowpass'; f.Q.value = p.q || 0.7;
  if (p.fenv) { f.frequency.setValueAtTime(p.cut * p.fenv, t); f.frequency.setTargetAtTime(p.cut, t, p.fdec || 0.08); }
  else f.frequency.value = p.cut;
  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0, t); amp.gain.linearRampToValueAtTime(v, t + a);
  amp.gain.setTargetAtTime(v * s, t + a, d / 3); amp.gain.setTargetAtTime(0, end, r / 3);
  p.waves.forEach(([type, det, oct]) => {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.value = mtof(m + 12 * (oct || 0)); o.detune.value = det || 0;
    o.connect(f); o.start(t); o.stop(end + r * 2 + 0.05);
  });
  f.connect(amp); sendTo(amp, p.rev, p.dly);
}
const P = {
  sawBass:  {waves:[['sawtooth',0],['square',0,-1]], cut:380, fenv:3, fdec:0.06, q:2, a:0.004, d:0.2, s:0.5, r:0.05, vol:0.19},
  subBass:  {waves:[['sine',0],['triangle',0,1]], cut:900, a:0.004, d:0.3, s:0.75, r:0.06, vol:0.3},
  octBass:  {waves:[['sawtooth',0]], cut:650, fenv:2.5, fdec:0.05, q:3, a:0.003, d:0.12, s:0.4, r:0.04, vol:0.2},
  sawPad:   {waves:[['sawtooth',-9],['sawtooth',9]], cut:1400, a:0.15, d:0.6, s:0.8, r:0.5, vol:0.032, rev:0.5},
  softPad:  {waves:[['triangle',-5],['sine',6,1]], cut:2500, a:0.25, d:0.6, s:0.8, r:0.6, vol:0.045, rev:0.6},
  brass:    {waves:[['sawtooth',-6],['square',6]], cut:950, fenv:2.5, fdec:0.12, a:0.04, d:0.3, s:0.7, r:0.25, vol:0.03, rev:0.35},
  strings:  {waves:[['sawtooth',-11],['sawtooth',0],['sawtooth',11]], cut:2200, a:0.25, d:0.5, s:0.85, r:0.4, vol:0.022, rev:0.6},
  piano:    {waves:[['triangle',0],['sine',0,1],['square',3]], cut:2400, fenv:1.6, fdec:0.2, a:0.003, d:0.5, s:0.15, r:0.25, vol:0.055, rev:0.25},
  clav:     {waves:[['square',0]], cut:1800, fenv:2, fdec:0.04, q:4, a:0.002, d:0.08, s:0.1, r:0.04, vol:0.045},
  squareLead:{waves:[['square',-4],['square',4]], cut:2600, a:0.01, d:0.2, s:0.7, r:0.12, vol:0.05, rev:0.2, dly:0.35},
  bell:     {waves:[['sine',0],['sine',0,2],['triangle',2,1]], cut:5000, a:0.003, d:0.6, s:0.2, r:0.4, vol:0.08, rev:0.35, dly:0.3},
  sawLead:  {waves:[['sawtooth',-7],['sawtooth',7]], cut:3000, fenv:1.5, fdec:0.1, a:0.01, d:0.2, s:0.75, r:0.15, vol:0.045, rev:0.25, dly:0.3},
  pluck:    {waves:[['square',0]], cut:2400, fenv:2.5, fdec:0.05, a:0.002, d:0.15, s:0, r:0.1, vol:0.045, rev:0.2, dly:0.25},
  vLead:    {waves:[['triangle',0],['sine',0,1]], cut:3000, a:0.02, d:0.3, s:0.7, r:0.15, vol:0.07, rev:0.3, dly:0.2},
};
function kick(t, v) {
  v = v || 1;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.setTargetAtTime(42, t, 0.035);
  g.gain.setValueAtTime(0.95 * v, t); g.gain.setTargetAtTime(0, t + 0.02, 0.09);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.5);
}
function noiseHit(t, type, freq, q, v, dec, rev) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.setValueAtTime(v, t); g.gain.setTargetAtTime(0, t, dec / 3);
  s.connect(f); f.connect(g); sendTo(g, rev, 0);
  s.start(t, Math.random() * 1.5); s.stop(t + dec * 2 + 0.05);
}
function snare(t, v, big) {
  v = v || 1;
  noiseHit(t, 'highpass', 1300, 0.7, 0.42 * v, big ? 0.3 : 0.18, big ? 0.6 : 0.22);
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(210, t); o.frequency.setTargetAtTime(160, t, 0.03);
  g.gain.setValueAtTime(0.3 * v, t); g.gain.setTargetAtTime(0, t, 0.03);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.2);
}
function clap(t) { [0, 0.011, 0.023].forEach((o, i) => noiseHit(t + o, 'bandpass', 1500, 1, 0.22, i === 2 ? 0.16 : 0.02, 0.3)); }
const hat = (t, open, v) => noiseHit(t, 'highpass', 8000, 0.7, (open ? 0.11 : 0.075) * (v || 1), open ? 0.25 : 0.035, 0);
const shaker = (t, v) => noiseHit(t, 'bandpass', 6500, 1.5, 0.05 * (v || 1), 0.05, 0);
const crash = t => noiseHit(t, 'highpass', 5000, 0.5, 0.1, 1.4, 0.3);
function riser(t, len) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
  f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(7000, t + len);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + len); g.gain.linearRampToValueAtTime(0, t + len + 0.05);
  s.connect(f); f.connect(g); sendTo(g, 0.3, 0); s.start(t); s.stop(t + len + 0.1);
}

/* ---------- songwriting ---------- */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const NOTE_NAMES = ['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MAJOR = [0,2,4,5,7,9,11];
const DEG = {I:[0,'M'], ii:[2,'m'], iii:[4,'m'], IV:[5,'M'], V:[7,'M'], vi:[9,'m'], bVII:[10,'M']};
const PROGS = [['I','V','vi','IV'],['vi','IV','I','V'],['I','vi','IV','V'],['IV','I','V','vi'],['I','IV','vi','V'],
  ['vi','V','IV','V'],['I','iii','IV','V'],['I','V','IV','IV'],['IV','V','iii','vi'],['I','bVII','IV','I'],['ii','IV','I','V']];
const PALETTES = {
  synth:    {name:'Synth-pop', bass:'sawBass', bassPat:'eighths', pad:'sawPad', comp:null, lead:'squareLead', arp:'pluck', drums:'four', clap:true},
  piano:    {name:'Piano pop', bass:'subBass', bassPat:'pop', pad:'softPad', comp:'piano', compPat:'quarters', lead:'bell', arp:null, drums:'backbeat'},
  eighties: {name:'80s pop', bass:'octBass', bassPat:'octaves', pad:'brass', comp:null, lead:'sawLead', arp:'pluck', drums:'backbeat', bigSnare:true},
  disco:    {name:'Disco pop', bass:'octBass', bassPat:'octaves', pad:'strings', comp:'clav', compPat:'offbeats', lead:'squareLead', arp:null, drums:'four', discoHat:true, clap:true},
};
const TEMPLATES = [
  [['Intro',4],['Verse',8],['Chorus',8],['Verse',8],['Chorus',8],['Breakdown',4],['Chorus',8],['Outro',4]],
  [['Intro',4],['Verse',8],['Pre-chorus',4],['Chorus',8],['Verse',8],['Pre-chorus',4],['Chorus',8],['Chorus',8],['Outro',4]],
  [['Intro',4],['Chorus',8],['Verse',8],['Pre-chorus',4],['Chorus',8],['Breakdown',4],['Chorus',8],['Outro',4]],

  if (st.gps === 'denied' && !st.test) showMsg('Location is blocked. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using.');

  let beat = -1;
  if (st.playing && ctx) {
    if (st.mode === 'groove') {
      const now = ctx.currentTime;
      while (beatQueue.length && beatQueue[0].t <= now) {
        const e = beatQueue.shift();
        if (e.info) { st.now = e.info.now; st.sub = e.info.sub; } else { litBeat = e.n; litAt = e.t; }
      }
      if (litBeat >= 0 && now - litAt < 60 / st.bpm * 0.45) beat = litBeat;
    } else {
      const d = decks[cur];
      if (d.clip && !d.el.paused) { const ph = d.el.currentTime * d.clip.bpm / 60; if (ph % 1 < 0.45) beat = Math.floor(ph) % 4; }
    }
  }
  $('#now').textContent = st.playing ? st.now : (st.now === 'Nothing yet' ? 'Nothing yet' : 'Paused');
  $('#nowSub').textContent = st.playing ? st.sub : '';
  beatEls.forEach((el, i) => { el.classList.toggle('on', i === beat); el.classList.toggle('down', i === 0); });
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(async () => { await Promise.all([loadManifest(), loadUserClips()]); renderLib(); })();
requestAnimationFrame(frame);
})();
</script>
