<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A cardboard wind tunnel built in December 2017." />
  <title>Wind Tunnel</title>
  <link rel="stylesheet" href="/styles.css?v=20261031" />
  <style>
    .wt-shell { width: min(100% - 64px, 960px); margin: 0 auto; padding-bottom: 56px; }
    .wt-shell .essay-header { padding-bottom: 24px; }
    .wt-collage { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-flow: dense; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .wt-collage figure { position: relative; margin: 0; overflow: hidden; border-radius: 10px; background: #111; }
    .wt-collage img, .wt-collage video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .wt-collage figcaption { position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 4px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11.5px; line-height: 1.4; }
    .wt-hero { grid-column: 1 / -1; aspect-ratio: 2576 / 871; }
    .wt-portrait { grid-column: span 2; aspect-ratio: 9 / 16; }
    .wt-square { grid-column: span 2; aspect-ratio: 1 / 1; }
    @media (max-width: 600px) {
      .wt-shell { width: calc(100% - 32px); }
      .wt-collage { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .wt-portrait, .wt-square { grid-column: span 1; }
      .wt-honeycomb { aspect-ratio: 1 / 1; }
    }
  </style>
</head>
<body>
  <div class="wt-shell">
    <header class="essay-header">
      <a class="back-link" href="/">← All work</a>
      <h1>Wind Tunnel</h1>
    </header>
    <main class="wt-collage">
      <figure class="wt-hero">
        <img src="media/tunnel.jpg" width="1600" height="541" alt="A long cardboard wind tunnel wrapped in holiday paper and string lights, with a viewing window in its test section" />
      </figure>
      <figure class="wt-portrait">
        <video src="media/anemometer.mp4" poster="media/anemometer.jpg" autoplay muted loop playsinline preload="metadata" aria-label="A cup anemometer spinning in the test section"></video>
        <figcaption>Cup anemometer</figcaption>
      </figure>
      <figure class="wt-portrait">
        <video src="media/smoke.mp4" poster="media/smoke.jpg" autoplay muted loop playsinline preload="metadata" aria-label="Smoke drifting across the test section window"></video>
        <figcaption>Smoke flow</figcaption>
      </figure>
      <figure class="wt-portrait wt-honeycomb">
        <img src="media/inside.jpg" width="900" height="1200" alt="View down the inside of the tunnel toward a honeycomb of tubes" loading="lazy" />
        <figcaption>Honeycomb</figcaption>
      </figure>
      <figure class="wt-square">
        <img src="media/fan.jpg" width="900" height="937" alt="The box fan mounted in a cardboard frame" loading="lazy" />
      </figure>
      <figure class="wt-square">
        <video src="media/deflection.mp4" poster="media/deflection.jpg" autoplay muted loop playsinline preload="metadata" aria-label="A ruler mounted across the test section window, with a strip below it moving in the airflow"></video>
      </figure>
      <figure class="wt-square">
        <img src="media/contraction.jpg" width="900" height="1200" alt="The contraction section being taped together" loading="lazy" />
      </figure>
    </main>
  </div>
</body>
</html>
